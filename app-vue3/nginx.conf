server {
  listen 80;
  root /usr/share/nginx/html;

  # /assets/index-abc.js -> /usr/share/nginx/html/assets/index-abc.js (hashed, cache forever)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: any page URL gets the shell. Real client-side routing happens in Vue Router.
  location / {
    try_files /index.html =404;
    add_header Cache-Control "no-store";
  }
}
