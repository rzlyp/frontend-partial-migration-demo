# Docker's embedded DNS. Upstreams are resolved per request (variables below), not once at start-up,
# so rebuilding or restarting one service never leaves the gateway pointing at a stale container IP.
resolver 127.0.0.11 valid=5s ipv6=off;

# Kill switch / QA override:  document.cookie = "ui=legacy; path=/"  (or ui=vue3)
# Phase 3+ canary: replace `default vue3` with a split_clients cohort (see MIGRATION_PLAN.md §4.4)
map $cookie_ui $v3_target {
  default vue3:80;
  legacy  nuxt2:3000;
}
map $cookie_ui $v3_name {          # value of the X-Served-By header
  default vue3;
  legacy  legacy;
}

server {
  listen 80;
  server_name _;

  set $legacy_target "nuxt2:3000";
  set $vue3_target   "vue3:80";
  set $api_target    "backend:8080";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API: same origin as both apps, so cookies just work and no CORS is needed.
  # Never part of the migration manifest: it is not a page.
  location ^~ /api/ {
    include /etc/nginx/proxy-common.conf;
    proxy_pass http://$api_target;
    add_header X-Served-By backend always;
  }

  # Vue 3 build assets (Vite default: /assets/; Nuxt 2 owns /_nuxt/)
  location ^~ /assets/ {
    include /etc/nginx/proxy-common.conf;
    proxy_pass http://$vue3_target;
    add_header X-Served-By vue3 always;
  }

  # Route list for the legacy app: it fetches this at runtime (no rebuild of legacy when a route moves).
  # Never cached by browsers or the CDN: a stale list would send users to the wrong app.
  location = /migrated-routes.json {
    alias /etc/nginx/migrated-routes.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Served-By gateway always;
  }

  # Routes migrated to Vue 3 (generated)
  include /etc/nginx/migrated-paths.conf;

  # Default: everything else is still legacy Nuxt 2 (incl. /_nuxt/*)
  location / {
    include /etc/nginx/proxy-common.conf;
    proxy_pass http://$legacy_target;
    add_header X-Served-By legacy always;
  }
}
