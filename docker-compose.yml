# One command, nothing else to run:
#   docker compose up --build        ->  http://localhost:8080
# Only the gateway is published to the host. Services start in dependency order and the gateway
# starts last, once the API, legacy and Vue 3 containers report healthy.
name: pos-demo

services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"      # if 8080 is taken:  GATEWAY_PORT=8090 docker compose up --build
    volumes:
      # Mounted so a routing change needs only:  docker compose exec gateway nginx -s reload
      - ./gateway/migrated-paths.conf:/etc/nginx/migrated-paths.conf:ro
      - ./gateway/migrated-routes.json:/etc/nginx/migrated-routes.json:ro
    depends_on:
      backend: { condition: service_healthy }
      nuxt2:   { condition: service_healthy }
      vue3:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # DEV ONLY. In staging/production inject from AWS Secrets Manager / EB environment properties.
      JWT_SECRET: "dev-only-jwt-secret-please-change-0123456789"
      ACCESS_TTL: "${ACCESS_TTL:-15m}"       # e.g. ACCESS_TTL=20s docker compose up -d to watch silent refresh
      REFRESH_TTL: "8h"
      REFRESH_GRACE: "30s"
      COOKIE_SECURE: "false"                 # true behind HTTPS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nuxt2:
    build: ./legacy-nuxt2
    environment:
      # SSR renders on the server, so it calls the API container directly and forwards the user's cookie
      API_INTERNAL_URL: "http://backend:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  vue3:
    build: ./app-vue3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
